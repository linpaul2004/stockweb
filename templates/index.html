<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股即時行情</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>台股即時行情</h1>
      <p class="subtitle">即時資料：twstock · 走勢圖：yfinance</p>
    </header>

    <section class="search-panel">
      <label for="stock-code">股票代號或名稱</label>
      <div class="search-row">
        <div class="search-input-wrap">
          <input
            id="stock-code"
            type="text"
            value=""
            placeholder="例如 0050 或 台積電"
            autocomplete="off"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="stock-suggestions"
          >
          <ul id="stock-suggestions" class="stock-suggestions hidden" role="listbox"></ul>
        </div>
        <button id="search-btn" type="button">查詢</button>
      </div>
    </section>

    <main id="stock-panel" class="stock-panel hidden">
      <div class="stock-top">
        <div class="stock-main">
          <div class="stock-header">
            <p class="stock-code" id="display-code"></p>
            <h2 id="display-name"></h2>
            <p class="stock-fullname" id="display-fullname"></p>
          </div>

          <div class="price-card price-card-compact">
            <p class="price-label" id="price-label">最近成交價</p>
            <p class="price-value" id="display-price"></p>
            <p class="price-change" id="display-change"></p>
          </div>
        </div>

        <aside class="stock-sidebar">
          <p class="update-time" id="display-time"></p>
          <div class="stock-status">
            <span id="status-text">準備載入...</span>
            <span id="countdown-wrap" class="countdown-wrap hidden">
              下次更新：
              <strong id="countdown">{{ refresh_seconds }}</strong>
              秒
            </span>
            <label class="color-toggle" for="invert-colors-toggle">
              <span class="color-toggle-label">台股配色</span>
              <input type="checkbox" id="invert-colors-toggle" checked>
              <span class="toggle-track" aria-hidden="true">
                <span class="toggle-thumb"></span>
              </span>
            </label>
          </div>
        </aside>
      </div>

      <div class="chart-order-row">
        <section class="chart-section">
          <div class="chart-header">
            <h3>最近單日走勢</h3>
            <p id="chart-prev-close" class="chart-meta"></p>
          </div>
          <div class="chart-legend" id="chart-legend">
            <span class="chart-legend-item hidden" id="chart-legend-trade">
              <span class="chart-legend-line chart-legend-line-trade" aria-hidden="true"></span>
              成交價
            </span>
            <span class="chart-legend-item hidden" id="chart-legend-prev">
              <span class="chart-legend-line chart-legend-line-prev" aria-hidden="true"></span>
              昨收
            </span>
          </div>
          <div class="chart-wrap">
            <canvas id="price-chart"></canvas>
          </div>
          <p id="chart-message" class="chart-message hidden"></p>
        </section>

        <section class="order-book">
          <h3>五檔報價</h3>
          <div class="order-book-layout" id="order-book-layout">
            <span class="order-book-head-side" aria-hidden="true"></span>
            <span class="order-book-head-price">價格</span>
            <span class="order-book-head-volume">量</span>
          </div>
        </section>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">開盤</span>
          <span class="stat-value" id="display-open">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">最高</span>
          <span class="stat-value" id="display-high">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">最低</span>
          <span class="stat-value" id="display-low">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">單筆成交量</span>
          <span class="stat-value" id="display-trade-volume"></span>
        </div>
        <div class="stat-card">
          <span class="stat-label">累計成交量</span>
          <span class="stat-value" id="display-accum-volume">—</span>
        </div>
      </div>
    </main>

    <div id="error-panel" class="error-panel hidden"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
  <script>
    window.STOCK_CONFIG = {
      defaultStock: "{{ default_stock }}",
      refreshSeconds: "{{ refresh_seconds }}",
    };
  </script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
